<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribbon Current</title>
    <style>
        :root {
            color-scheme: light;
            --sky-top: #fff7ef;
            --sky-mid: #ffe7d6;
            --sky-bottom: #f8c9a7;
            --shadow: rgba(77, 24, 0, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 35%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
        }

        .scene {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            isolation: isolate;
        }

        .glow {
            position: absolute;
            inset: auto;
            border-radius: 999px;
            filter: blur(24px);
            opacity: 0.55;
            pointer-events: none;
        }

        .glow-left {
            width: 26rem;
            height: 26rem;
            left: -6rem;
            top: -6rem;
            background: rgba(255, 255, 255, 0.95);
        }

        .glow-right {
            width: 22rem;
            height: 22rem;
            right: -8rem;
            bottom: -8rem;
            background: rgba(255, 173, 120, 0.32);
        }

        .ribbon-stack {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-rows: repeat(8, 1fr);
        }

        .ribbon {
            position: relative;
            overflow: visible;
            filter: drop-shadow(0 0.85rem 1rem var(--shadow));
        }

        .ribbon::before,
        .ribbon::after {
            content: "";
            position: absolute;
            left: -8vw;
            width: 116vw;
            height: 140%;
            top: -20%;
            border-radius: 50% / 42%;
            transform-origin: center;
        }

        .ribbon::before {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.03) 42%, rgba(0, 0, 0, 0.14) 100%),
                var(--ribbon-gradient);
            animation:
                crest var(--duration) ease-in-out infinite,
                drift calc(var(--duration) * 1.5) ease-in-out infinite;
        }

        .ribbon::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.72), transparent 45%, rgba(255, 255, 255, 0.08) 100%);
            mix-blend-mode: screen;
            opacity: 0.66;
            animation:
                crestHighlight calc(var(--duration) * 0.92) ease-in-out infinite,
                shimmer calc(var(--duration) * 1.7) linear infinite;
        }

        .ribbon-1 { --ribbon-gradient: linear-gradient(90deg, #ff6b6b 0%, #ff8e8e 50%, #ffb39a 100%); --duration: 8.5s; }
        .ribbon-2 { --ribbon-gradient: linear-gradient(90deg, #f48c06 0%, #ffba08 48%, #ffd65a 100%); --duration: 9.3s; }
        .ribbon-3 { --ribbon-gradient: linear-gradient(90deg, #4caf50 0%, #84cc5f 46%, #b8e986 100%); --duration: 8.8s; }
        .ribbon-4 { --ribbon-gradient: linear-gradient(90deg, #2ec4b6 0%, #38a3a5 50%, #82d8c8 100%); --duration: 10s; }
        .ribbon-5 { --ribbon-gradient: linear-gradient(90deg, #4d6cfa 0%, #6f5ef5 45%, #9a7cf6 100%); --duration: 8.9s; }
        .ribbon-6 { --ribbon-gradient: linear-gradient(90deg, #8a5cf6 0%, #be7bff 50%, #d5a0ff 100%); --duration: 9.8s; }
        .ribbon-7 { --ribbon-gradient: linear-gradient(90deg, #f15bb5 0%, #d2649a 48%, #f3a6c5 100%); --duration: 9.1s; }
        .ribbon-8 { --ribbon-gradient: linear-gradient(90deg, #ff4d6d 0%, #ff758f 48%, #ff9fb2 100%); --duration: 8.7s; }

        .overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(34rem, calc(100vw - 2rem));
            aspect-ratio: 1;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.68), rgba(255, 246, 237, 0.2) 65%, rgba(255, 231, 214, 0.12) 100%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            box-shadow: 0 1.4rem 3rem rgba(101, 51, 17, 0.16);
        }

        .circle-menu {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
        }

        .center-core {
            position: absolute;
            inset: 50%;
            width: 43%;
            height: 43%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 1.4rem;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.92), rgba(255, 240, 228, 0.9));
            color: rgba(82, 29, 7, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 0 0 1px rgba(255, 196, 161, 0.3), 0 1rem 2rem rgba(122, 61, 14, 0.12);
            z-index: 3;
        }

        .center-core h1 {
            font-size: clamp(1.8rem, 4.5vw, 3.4rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .center-core p {
            margin-top: 0.45rem;
            font-size: clamp(0.74rem, 1.5vw, 0.92rem);
            line-height: 1.45;
        }

        .segment {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%);
            text-decoration: none;
            color: #4c1f06;
            transition: transform 0.3s ease, filter 0.3s ease;
            z-index: 1;
        }

        .segment::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.02) 55%, rgba(110, 45, 9, 0.12) 100%),
                var(--segment-bg);
            opacity: 0.96;
        }

        .segment:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
            z-index: 2;
        }

        .segment-content {
            position: absolute;
            left: 71%;
            top: 26%;
            width: 8.4rem;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 0.4rem;
            z-index: 2;
        }

        .segment strong {
            display: block;
            font-size: clamp(0.8rem, 1.45vw, 1rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .segment span {
            display: block;
            margin-top: 0.35rem;
            font-size: clamp(0.72rem, 1.18vw, 0.88rem);
            line-height: 1.35;
            opacity: 0.8;
        }

        .segment-1 {
            --segment-bg: linear-gradient(135deg, #ffd6cc, #ffac97);
            transform: rotate(-90deg);
        }

        .segment-2 {
            --segment-bg: linear-gradient(135deg, #ffe39b, #ffc85f);
            transform: rotate(-18deg);
        }

        .segment-3 {
            --segment-bg: linear-gradient(135deg, #c7f0b1, #8fd97c);
            transform: rotate(54deg);
        }

        .segment-4 {
            --segment-bg: linear-gradient(135deg, #bdeee7, #6ed2c7);
            transform: rotate(126deg);
        }

        .segment-5 {
            --segment-bg: linear-gradient(135deg, #e1d3ff, #b69bff);
            transform: rotate(198deg);
        }

        .segment-1 .segment-content { transform: translate(-50%, -50%) rotate(90deg); }
        .segment-2 .segment-content { transform: translate(-50%, -50%) rotate(18deg); }
        .segment-3 .segment-content { transform: translate(-50%, -50%) rotate(-54deg); }
        .segment-4 .segment-content { transform: translate(-50%, -50%) rotate(-126deg); }
        .segment-5 .segment-content { transform: translate(-50%, -50%) rotate(-198deg); }

        .menu-ring {
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 1px dashed rgba(112, 49, 12, 0.16);
            pointer-events: none;
        }

        @keyframes crest {
            0%, 100% {
                transform: translateX(-2vw) translateY(0%) scaleY(1) rotate(-0.6deg) skewX(-6deg);
            }
            25% {
                transform: translateX(1vw) translateY(-10%) scaleY(1.18) rotate(0.8deg) skewX(5deg);
            }
            50% {
                transform: translateX(-1vw) translateY(8%) scaleY(0.9) rotate(-0.9deg) skewX(-7deg);
            }
            75% {
                transform: translateX(2vw) translateY(-7%) scaleY(1.12) rotate(0.65deg) skewX(6deg);
            }
        }

        @keyframes drift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes crestHighlight {
            0%, 100% {
                transform: translateX(-1vw) translateY(3%) scaleY(0.94) rotate(0deg);
                opacity: 0.55;
            }
            50% {
                transform: translateX(2vw) translateY(-11%) scaleY(1.14) rotate(0.4deg);
                opacity: 0.78;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 180% 0%;
            }
        }

        @media (max-width: 700px) {
            .ribbon::before,
            .ribbon::after {
                left: -12vw;
                width: 124vw;
                height: 160%;
                top: -30%;
            }

            .overlay {
                width: min(92vw, 30rem);
            }

            .center-core {
                width: 48%;
                height: 48%;
                padding: 1rem;
            }

            .segment-content {
                width: 5.7rem;
                left: 72%;
                top: 24%;
            }
        }
    </style>
</head>
<body>
    <main class="scene">
        <div class="glow glow-left"></div>
        <div class="glow glow-right"></div>

        <section class="ribbon-stack" aria-label="Animated ribbon artwork">
            <div class="ribbon ribbon-1"></div>
            <div class="ribbon ribbon-2"></div>
            <div class="ribbon ribbon-3"></div>
            <div class="ribbon ribbon-4"></div>
            <div class="ribbon ribbon-5"></div>
            <div class="ribbon ribbon-6"></div>
            <div class="ribbon ribbon-7"></div>
            <div class="ribbon ribbon-8"></div>
        </section>

        <section class="overlay" aria-label="Yugal blog navigation">
            <nav class="circle-menu">
                <a class="segment segment-1" href="./article-1.html">
                    <div class="segment-content">
                        <strong>Article 01</strong>
                        <span>Notes on building with motion</span>
                    </div>
                </a>
                <a class="segment segment-2" href="./article-2.html">
                    <div class="segment-content">
                        <strong>Article 02</strong>
                        <span>Thoughts from the workshop floor</span>
                    </div>
                </a>
                <a class="segment segment-3" href="./article-3.html">
                    <div class="segment-content">
                        <strong>Article 03</strong>
                        <span>Design ideas worth keeping</span>
                    </div>
                </a>
                <a class="segment segment-4" href="./article-4.html">
                    <div class="segment-content">
                        <strong>Article 04</strong>
                        <span>Small lessons from daily work</span>
                    </div>
                </a>
                <a class="segment segment-5" href="./article-5.html">
                    <div class="segment-content">
                        <strong>Article 05</strong>
                        <span>What I want this blog to become</span>
                    </div>
                </a>

                <div class="menu-ring"></div>

                <div class="center-core">
                    <div>
                        <h1>Yugal</h1>
                        <p>Writing in progress. Step into any section to open a starter article page.</p>
                    </div>
                </div>
            </nav>
        </section>
    </main>
</body>
</html>
